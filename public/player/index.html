<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Player</title>
  <script>
    // Dynamic title for the current deployment brand. Best-effort: if the
    // player boots offline (Android cache fallback), title stays generic —
    // not visible inside the kiosk WebView anyway, but kept consistent for
    // debugging in a real browser.
    (function () {
      fetch('/api/branding', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (b) {
          if (!b) return;
          var name = (b.systemName && String(b.systemName).trim()) || 'NeoFit TV';
          document.title = name + ' Player';
        })
        .catch(function () {});
    })();
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; cursor: none; }
    body.show-cursor { cursor: default; }
    #player { position: relative; width: 100%; height: 100%; }
    #mediaContainer { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #mediaContainer img, #mediaContainer video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
    .placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #666; }
    .placeholder svg { margin-bottom: 1rem; }
    .placeholder h2 { font-size: 1.5rem; margin-bottom: .5rem; }
    .placeholder p { font-size: .9rem; }
  </style>
</head>
<body>
  <div id="player">
    <div id="mediaContainer">
      <div class="placeholder" id="placeholder">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        <h2>Нет контента</h2>
        <p>Плейлист не назначен для этого экрана</p>
      </div>
    </div>
  </div>
  <script src="/js/player.js"></script>
</body>
</html>
