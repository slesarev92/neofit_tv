<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
  (function(){var t=localStorage.getItem('admin-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Вход — NeoFit_TV</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body class="login-page" data-page-title="Вход">
  <div style="position:fixed;top:1rem;right:1rem;z-index:10;">
    <div class="theme-toggle">
    <span class="theme-toggle-icon theme-toggle-icon-sun" aria-hidden="true">☀️</span>
    <label class="theme-toggle-track">
      <input type="checkbox" id="theme-toggle" class="theme-toggle-input" aria-label="Переключить тему">
      <span class="theme-toggle-thumb"></span>
    </label>
    <span class="theme-toggle-icon theme-toggle-icon-moon" aria-hidden="true">🌙</span>
  </div>
  </div>
  <div class="login-card">
    <div class="login-logo">
      <img src="/logo.png" alt="NeoFit" style="height: 48px; width: auto;">
    </div>
    <h1>NeoFit TV</h1>
    <p class="login-subtitle">Панель управления</p>
    <form id="loginForm">
      <div id="passwordStep">
        <div class="form-group">
          <label for="password">Пароль администратора</label>
          <input type="password" id="password" name="password" required autofocus placeholder="Введите пароль">
        </div>
      </div>
      <div id="totpStep" style="display:none;">
        <div class="form-group">
          <label for="totpCode">Введите код из Google Authenticator</label>
          <input type="text" id="totpCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000">
        </div>
        <button type="button" id="backToPassword" class="btn btn-secondary btn-block" style="margin-bottom:0.5rem;">Назад</button>
      </div>
      <div id="errorMsg" class="error-msg" hidden></div>
      <button type="submit" class="btn btn-primary btn-block">Войти</button>
    </form>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    (function () {
      const form = document.getElementById('loginForm');
      const passwordStep = document.getElementById('passwordStep');
      const totpStep = document.getElementById('totpStep');
      const errorEl = document.getElementById('errorMsg');
      const passwordInput = document.getElementById('password');
      const totpInput = document.getElementById('totpCode');
      const backBtn = document.getElementById('backToPassword');
      const submitBtn = form.querySelector('button[type="submit"]');

      function showError(message) {
        errorEl.textContent = message;
        errorEl.hidden = !message;
      }

      function showPasswordStep() {
        passwordStep.style.display = '';
        totpStep.style.display = 'none';
        showError('');
        passwordInput.focus();
      }

      function showTotpStep() {
        passwordStep.style.display = 'none';
        totpStep.style.display = '';
        showError('');
        totpInput.value = '';
        totpInput.focus();
      }

      backBtn.addEventListener('click', function () {
        showPasswordStep();
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (submitBtn.disabled) return;
        submitBtn.disabled = true;
        showError('');
        try {
          if (totpStep.style.display === 'none') {
            const res = await API.login(passwordInput.value);
            if (res && res.step === 'totp') {
              showTotpStep();
              return;
            }
            const returnUrl = new URLSearchParams(window.location.search).get('returnUrl');
            window.location.href = returnUrl && returnUrl.startsWith('/') ? returnUrl : '/admin/index.html';
          } else {
            const code = (totpInput.value || '').trim();
            if (!code) {
              showError('Код обязателен');
              return;
            }
            await API.verifyTotp(code);
            const returnUrl = new URLSearchParams(window.location.search).get('returnUrl');
            window.location.href = returnUrl && returnUrl.startsWith('/') ? returnUrl : '/admin/index.html';
          }
        } catch (err) {
          showError(err.message || 'Ошибка входа');
        } finally {
          submitBtn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
