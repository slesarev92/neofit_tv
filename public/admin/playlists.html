<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){var t=localStorage.getItem('admin-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Плейлисты — NeoFit_TV</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    .auth-pending{visibility:hidden!important}
    :root{--font-sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
    .page-header h1{letter-spacing:-.025em}
    .playlist-items{gap:.375rem}
    .playlist-item{border-radius:10px;transition:background .12s,box-shadow .12s}
    .playlist-item:hover{box-shadow:0 2px 10px rgba(0,0,0,.09)}
    .drag-handle{transition:color .15s;opacity:.5}
    .playlist-item:hover .drag-handle{opacity:1;color:var(--primary)}
    .modal .modal-header h2{letter-spacing:-.02em}

    /* View toggle buttons */
    .msi-view-toggle{display:flex;gap:2px;margin-bottom:.5rem;justify-content:flex-end}
    .msi-view-btn{background:var(--gray-100);border:1px solid var(--gray-200);border-radius:6px;padding:.3rem .45rem;cursor:pointer;color:var(--gray-500);transition:background .15s,color .15s;display:flex;align-items:center}
    .msi-view-btn:hover{background:var(--gray-200);color:var(--gray-700)}
    .msi-view-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}

    /* Shared item structure */
    .msi-thumb{flex-shrink:0}
    .msi-info{min-width:0}
    .msi-name{font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .msi-meta{font-size:.7rem;color:var(--gray-500);margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* Grid view (default) */
    .media-select-grid:not(.list-view) .media-select-item{display:block}
    .media-select-grid:not(.list-view) .msi-thumb{overflow:hidden;height:80px;width:100%}
    .media-select-grid:not(.list-view) .msi-thumb-inner{width:100%;height:100%}
    .media-select-grid:not(.list-view) .msi-thumb-media{width:100%!important;height:80px!important;object-fit:cover!important;display:block!important}
    .media-select-grid:not(.list-view) .msi-meta{display:none}
    .media-select-grid:not(.list-view) .msi-info{padding:.375rem}
    .media-select-grid:not(.list-view) .media-select-checkbox{position:absolute;top:.35rem;left:.35rem;z-index:1}

    /* List view */
    .media-select-grid.list-view{display:flex;flex-direction:column;gap:0}
    .media-select-grid.list-view .media-select-item{display:flex!important;align-items:center;gap:.625rem;padding:.5rem .625rem;border:none!important;border-radius:0;border-bottom:1px solid var(--gray-100)}
    .media-select-grid.list-view .media-select-item:last-child{border-bottom:none}
    .media-select-grid.list-view .media-select-item:hover{background:var(--primary-light,#eff6ff)}
    .media-select-grid.list-view .media-select-checkbox{position:static!important;flex-shrink:0;margin:0}
    .media-select-grid.list-view .msi-thumb{width:52px!important;height:38px!important;flex-shrink:0;overflow:hidden;border-radius:4px}
    .media-select-grid.list-view .msi-thumb-inner{width:100%;height:100%}
    .media-select-grid.list-view .msi-thumb-media{width:52px!important;height:38px!important;object-fit:cover!important;display:block!important;border-radius:4px}
    .media-select-grid.list-view .msi-info{flex:1;min-width:0}
    .media-select-grid.list-view .msi-name{font-size:.8125rem}
    .media-select-grid.list-view .msi-meta{display:block}

    /* Компактные строки плейлиста */
    .playlist-item{padding:.35rem .625rem!important;gap:.5rem!important;margin-bottom:.25rem!important}
    .playlist-item .item-thumb{width:38px!important;height:28px!important}
    .playlist-item .item-name{font-size:.8125rem!important}
    .playlist-item .item-duration{width:62px!important}
    .playlist-item .item-duration input{padding:.2rem .4rem!important;font-size:.75rem!important}
    .playlist-item .drag-handle{font-size:.85rem!important}

    @media (max-width: 768px) {
      .page-header-actions .btn{width:100%;justify-content:center}
      .modal-footer{flex-direction:column}
      .modal-footer .btn{width:100%;justify-content:center}
      .playlist-item .item-name{font-size:.8125rem}
    }
  </style>
  <script src="/js/theme.js"></script>
  <script>(function(){document.documentElement.classList.add('auth-pending');var ru=encodeURIComponent(location.pathname+location.search);fetch('/api/settings',{credentials:'include'}).then(function(r){if(r.status===401){location.href='/login.html?returnUrl='+ru;return;}document.documentElement.classList.remove('auth-pending');}).catch(function(){location.href='/login.html?returnUrl='+ru;});})();</script>
</head>
<body class="app-layout" data-page-title="Плейлисты">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img class="sidebar-logo" alt="NeoFit">
      <span class="sidebar-brand-name">NeoFit TV</span>
    </div>
    <nav class="sidebar-nav" id="main-nav"></nav>
    <div class="sidebar-footer">
      <div id="theme-toggle-container"></div>
      <button type="button" class="btn btn-secondary btn-block btn-sm" id="sidebarLogoutBtn">Выйти</button>
    </div>
  </aside>
  <main class="main-content">
    <header class="page-header">
      <h1>Плейлисты</h1>
      <button type="button" class="btn btn-primary" id="btnCreatePlaylist" style="display:inline-flex;align-items:center;gap:.4rem;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Создать плейлист
      </button>
    </header>
    <div id="playlistsList"></div>
    <div class="modal-overlay" id="playlistModal">
      <div class="modal" style="max-width: 860px;">
        <div class="modal-header">
          <h2 id="playlistModalTitle">Создать плейлист</h2>
          <button type="button" class="close-btn" id="playlistModalClose" aria-label="Закрыть">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="playlistName">Название</label>
            <input type="text" id="playlistName" placeholder="Название плейлиста">
          </div>
          <div id="playlistTotalDuration" class="stat-label" style="margin-bottom: 1rem; font-weight: 500;"></div>
          <div class="form-group">
            <label>Элементы плейлиста</label>
            <button type="button" class="btn btn-secondary btn-sm" id="btnAddMediaInPlaylist">Добавить медиафайл</button>
            <ul id="playlistItems" class="playlist-items"></ul>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="playlistModalCancel">Отмена</button>
          <button type="button" class="btn btn-primary" id="playlistModalSave">Сохранить</button>
        </div>
      </div>
    </div>
    <div class="modal-overlay" id="mediaSelectModal">
      <div class="modal" style="max-width: 640px;">
        <div class="modal-header">
          <h2>Плейлист → Выбор медиа</h2>
          <button type="button" class="close-btn" id="mediaSelectModalClose" aria-label="Закрыть">&times;</button>
        </div>
        <div class="modal-body">
          <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;justify-content:flex-end;flex-wrap:wrap;">
            <select id="msiSort" style="font-size:.8125rem;padding:.25rem .5rem;border:1px solid var(--gray-200);border-radius:6px;background:var(--bg-card);color:var(--text-primary);cursor:pointer;">
              <option value="date-desc">Сначала новые</option>
              <option value="date-asc">Сначала старые</option>
              <option value="name-asc">По имени А–Я</option>
              <option value="name-desc">По имени Я–А</option>
              <option value="size-desc">По размеру ↓</option>
              <option value="size-asc">По размеру ↑</option>
            </select>
          <div class="msi-view-toggle" style="margin-bottom:0">
            <button type="button" class="msi-view-btn active" id="msiViewGrid" title="Сетка" aria-label="Вид: сетка">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            </button>
            <button type="button" class="msi-view-btn" id="msiViewList" title="Список" aria-label="Вид: список">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            </button>
          </div>
          </div>
          <input type="text" id="mediaSelectSearch" class="media-select-search" placeholder="Поиск по имени…" autocomplete="off">
          <div class="media-select-grid" id="mediaSelectGrid"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="mediaSelectModalCancel">Отмена</button>
          <button type="button" class="btn btn-primary" id="mediaSelectAddBtn">Добавить выбранные</button>
        </div>
      </div>
    </div>
    <div class="modal-overlay" id="playlistPreviewModal">
      <div class="modal" style="max-width: 90vw;">
        <div class="modal-header">
          <h2 id="playlistPreviewTitle">Просмотр медиа</h2>
          <button type="button" class="close-btn" id="playlistPreviewClose" aria-label="Закрыть">&times;</button>
        </div>
        <div class="modal-body">
          <img id="playlistPreviewImage" alt="" style="max-width:100%;max-height:70vh;display:none;">
          <video id="playlistPreviewVideo" controls playsinline style="width:100%;max-height:70vh;display:none;"></video>
        </div>
      </div>
    </div>
    <div class="modal-overlay" id="sendToScreensModal">
      <div class="modal" style="max-width: 480px;">
        <div class="modal-header">
          <h2 id="sendToScreensModalTitle">Отправить плейлист на экраны</h2>
          <button type="button" class="close-btn" id="sendToScreensModalClose" aria-label="Закрыть">&times;</button>
        </div>
        <div class="modal-body">
          <p id="sendToScreensModalPlaylistName" class="stat-label" style="margin-bottom: 0.75rem;"></p>
          <div style="margin-bottom: 0.5rem;">
            <button type="button" class="btn btn-secondary btn-sm" id="sendToScreensSelectAll">Выбрать все</button>
            <button type="button" class="btn btn-secondary btn-sm" id="sendToScreensDeselectAll">Снять все</button>
          </div>
          <div id="sendToScreensList"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="sendToScreensModalCancel">Отмена</button>
          <button type="button" class="btn btn-primary" id="sendToScreensModalSubmit">Отправить на выбранные экраны</button>
        </div>
      </div>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/admin-mobile.js"></script>
  <script src="/js/admin-playlists.js"></script>
</body>
</html>
