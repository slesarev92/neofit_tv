<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){var t=localStorage.getItem('admin-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Экраны — NeoFit_TV</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    .auth-pending{visibility:hidden!important}
    :root{--font-sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
    .page-header h1{letter-spacing:-.025em}
    .screens-filter-tabs{background:var(--gray-100);border-radius:10px;padding:3px;gap:2px}
    .screens-filter-tab{border-radius:8px;font-weight:500;transition:background .15s,box-shadow .15s,color .15s}
    .screens-filter-tab.active{background:var(--bg-primary);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--primary);font-weight:600}
    .screens-table td{vertical-align:middle}
    .screens-table th{font-size:.8125rem;font-weight:600;letter-spacing:.01em;text-transform:uppercase;color:var(--gray-500)}
    .card{border-radius:14px}
    @media (max-width: 768px) {
      .page-header-actions{flex-direction:column;width:100%}
      .page-header-actions .btn{width:100%;justify-content:center}
      .screens-filter-tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
      .screens-filter-tabs::-webkit-scrollbar{display:none}
      .screens-filter-tab{flex-shrink:0;white-space:nowrap}
    }
  </style>
  <script src="/js/theme.js"></script>
  <script>(function(){document.documentElement.classList.add('auth-pending');var ru=encodeURIComponent(location.pathname+location.search);fetch('/api/settings',{credentials:'include'}).then(function(r){if(r.status===401){location.href='/login.html?returnUrl='+ru;return;}document.documentElement.classList.remove('auth-pending');}).catch(function(){location.href='/login.html?returnUrl='+ru;});})();</script>
</head>
<body class="app-layout" data-page-title="Экраны">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img class="sidebar-logo" alt="NeoFit">
      <span class="sidebar-brand-name">NeoFit TV</span>
    </div>
    <nav class="sidebar-nav" id="main-nav"></nav>
    <div class="sidebar-footer">
      <div id="theme-toggle-container"></div>
      <button type="button" class="btn btn-secondary btn-block btn-sm" id="sidebarLogoutBtn">Выйти</button>
    </div>
  </aside>
  <main class="main-content">
    <header class="page-header">
      <h1>Экраны</h1>
      <div class="page-header-actions">
        <button type="button" id="btnAddByCode" class="btn btn-secondary" style="display:inline-flex;align-items:center;gap:.4rem;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          По коду
        </button>
        <button type="button" id="btnCreateScreen" class="btn btn-primary" style="display:inline-flex;align-items:center;gap:.4rem;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Создать экран
        </button>
      </div>
    </header>
    <section class="card">
      <div class="card-body">
        <div class="screens-toolbar">
          <div class="form-group screens-toolbar-search">
            <label for="screensSearch">Поиск</label>
            <input type="text" id="screensSearch" class="input" placeholder="По имени экрана…" autocomplete="off">
          </div>
          <div class="screens-filter-tabs" role="tablist">
            <button type="button" class="screens-filter-tab active" data-filter="all" role="tab" id="screensTabAll">Все (<span id="screensCountAll">0</span>)</button>
            <button type="button" class="screens-filter-tab" data-filter="online" role="tab">Онлайн (<span id="screensCountOnline">0</span>)</button>
            <button type="button" class="screens-filter-tab" data-filter="offline" role="tab">Офлайн (<span id="screensCountOffline">0</span>)</button>
          </div>
          <div class="form-group screens-toolbar-sort">
            <label for="screensSort">Сортировка</label>
            <select id="screensSort" class="media-sort-select">
              <option value="name-asc">По имени — А–Я</option>
              <option value="name-desc">По имени — Я–А</option>
              <option value="status">По статусу (онлайн сначала)</option>
              <option value="lastSeen-desc">По активности — недавние</option>
              <option value="lastSeen-asc">По активности — давние</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table class="screens-table">
            <thead>
              <tr>
                <th>Статус</th>
                <th>Название</th>
                <th>Плейлист</th>
                <th>Последняя активность</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody id="screensList"></tbody>
          </table>
        </div>
      </div>
    </section>

    <div class="modal-overlay" id="screenModal">
      <div class="modal" style="max-width: 480px;">
        <div class="modal-header">
          <h2 id="screenModalTitle">Создать экран</h2>
          <button type="button" class="close-btn" id="screenModalClose" aria-label="Закрыть">&times;</button>
        </div>
        <form id="screenForm">
          <div class="modal-body">
            <input type="hidden" id="screenId">
            <div class="form-group">
              <label for="screenName">Название</label>
              <input type="text" id="screenName" placeholder="Название экрана">
            </div>
            <div class="form-group">
              <label for="screenPlaylist">Плейлист</label>
              <select id="screenPlaylist" class="input"></select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="screenModalCancel">Отмена</button>
            <button type="submit" class="btn btn-primary">Сохранить</button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal-overlay" id="pairByCodeModal">
      <div class="modal" style="max-width: 400px;">
        <div class="modal-header">
          <h2>Добавить по коду</h2>
          <button type="button" class="close-btn" id="pairByCodeModalClose" aria-label="Закрыть">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="pairCodeInput">Код с экрана</label>
            <input type="text" id="pairCodeInput" class="input" placeholder="Например: A3X7K2" maxlength="10" autocomplete="off">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="pairByCodeModalCancel">Отмена</button>
          <button type="button" class="btn btn-primary" id="pairByCodeGoBtn">Перейти</button>
        </div>
      </div>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/admin-mobile.js"></script>
  <script src="/js/admin-screens.js"></script>
</body>
</html>
