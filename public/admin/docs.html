<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){var t=localStorage.getItem('admin-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Инструкция — NeoFit TV</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/docs.css">
  <style>.auth-pending{visibility:hidden!important}</style>
  <script src="/js/theme.js"></script>
  <script>(function(){document.documentElement.classList.add('auth-pending');var ru=encodeURIComponent(location.pathname+location.search);fetch('/api/settings',{credentials:'include'}).then(function(r){if(r.status===401){location.href='/login.html?returnUrl='+ru;return;}document.documentElement.classList.remove('auth-pending');}).catch(function(){location.href='/login.html?returnUrl='+ru;});})();</script>
</head>
<body class="app-layout" data-page-title="Инструкция">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img class="sidebar-logo" alt="NeoFit">
      <span class="sidebar-brand-name">NeoFit TV</span>
    </div>
    <nav class="sidebar-nav" id="main-nav"></nav>
    <div class="sidebar-footer">
      <div id="theme-toggle-container"></div>
      <button type="button" class="btn btn-secondary btn-block btn-sm" id="sidebarLogoutBtn">Выйти</button>
    </div>
  </aside>
  <main class="main-content">
    <header class="page-header">
      <h1>Инструкция</h1>
      <button type="button" class="btn btn-secondary btn-sm docs-nav-toggle" id="docsNavToggle" aria-label="Открыть разделы" style="display: none;">☰ Разделы</button>
    </header>
    <div class="docs-search-wrap">
      <input type="text" id="docsSearch" class="docs-search-input" placeholder="Поиск по разделам..." aria-label="Поиск по документации" autocomplete="off">
      <span class="docs-search-count" id="docsSearchCount" aria-live="polite"></span>
    </div>
    <div class="docs-layout">
      <nav class="docs-sidebar" id="docsSidebar" aria-label="Навигация по разделам">
        <div class="docs-sidebar-inner" id="docsSidebarInner"></div>
      </nav>
      <div class="docs-content" id="docsContent"></div>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/admin-mobile.js"></script>
  <script src="/js/docs-content.js"></script>
  <script>
(function(){
  if (typeof window.initDocsPage === 'function') {
    document.addEventListener('DOMContentLoaded', function() {
      window.initDocsPage();
    });
  }
  var logoutBtn = document.getElementById('sidebarLogoutBtn');
  if (logoutBtn && typeof API !== 'undefined') {
    logoutBtn.addEventListener('click', function() { API.logout().then(function() { location.href = '/login.html'; }); });
  }
})();
  </script>
</body>
</html>
