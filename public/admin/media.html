<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){var t=localStorage.getItem('admin-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Медиа — NeoFit_TV</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    .auth-pending{visibility:hidden!important}
    :root{--font-sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
    .page-header h1{letter-spacing:-.025em}
    .upload-zone{flex-direction:column;align-items:center;text-align:center;gap:.375rem;padding:2.25rem 2rem;border-radius:16px;border-width:2px;transition:border-color .2s,background .2s}
    .upload-zone .uz-icon{color:var(--primary);opacity:.65;margin-bottom:.25rem;flex-shrink:0}
    .upload-zone .uz-title{font-size:1rem;font-weight:600;color:var(--text-primary);margin:0}
    .upload-zone .uz-sub{margin:0;color:var(--gray-500);font-size:.875rem}
    .upload-zone .uz-link{color:var(--primary);text-decoration:underline;cursor:pointer}
    .upload-zone .uz-hint{font-size:.75rem;color:var(--gray-400);margin:0}
    .media-toolbar .form-group label{font-size:.8125rem;font-weight:500}
    .card.media-card-section{border-radius:14px}

    /* View toggle */
    .media-view-toggle{display:flex;gap:2px}
    .media-view-btn{background:var(--gray-100);border:1px solid var(--gray-200);border-radius:6px;padding:.3rem .45rem;cursor:pointer;color:var(--gray-500);transition:background .15s,color .15s;display:flex;align-items:center}
    .media-view-btn:hover{background:var(--gray-200);color:var(--gray-700)}
    .media-view-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}

    /* Media list view */
    .media-grid.list-view{display:flex;flex-direction:column;gap:0;background:var(--bg-primary);border:1px solid var(--gray-200);border-radius:12px;overflow:hidden}
    .media-grid.list-view .media-card{display:flex;flex-direction:row;align-items:center;gap:.625rem;padding:.45rem .75rem;border-radius:0;border-bottom:1px solid var(--gray-100);box-shadow:none;min-width:0}
    .media-grid.list-view .media-card:last-child,.media-grid.list-view .media-load-more-sentinel{border-bottom:none}
    .media-grid.list-view .media-thumb{width:64px;height:48px;flex-shrink:0;border-radius:6px;overflow:hidden;min-height:unset}
    .media-grid.list-view .media-thumb img,.media-grid.list-view .media-thumb video{width:100%;height:100%;object-fit:cover}
    .media-grid.list-view .media-info{flex:1;min-width:0;display:flex;align-items:center;gap:0;flex-wrap:nowrap}
    .media-grid.list-view .media-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:0;padding-right:.5rem}
    .media-grid.list-view .media-meta{width:240px;flex-shrink:0;display:flex;align-items:center;gap:.35rem;white-space:nowrap;margin-bottom:0;font-size:.8rem;border-right:1px solid var(--gray-200);margin-right:.75rem;padding-right:.75rem}
    .media-grid.list-view .media-usage{width:210px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:0;font-size:.8rem;padding-right:.5rem}
    .media-grid.list-view .media-info .btn{flex-shrink:0;margin-top:0;margin-left:auto}
    .media-grid.list-view .bulk-checkbox{flex-shrink:0}

    @media (max-width: 768px) {
      .upload-zone{padding:1.5rem 1rem;gap:.25rem}
      .upload-zone .uz-icon{width:32px;height:32px;margin-bottom:0}
      .upload-zone .uz-title{font-size:.9375rem}
      .media-bulk-bar{flex-wrap:wrap;gap:.5rem}
      .media-bulk-bar .bulk-count{width:100%;flex:none}
      .media-bulk-bar .btn{flex:1;justify-content:center}
      .page-header-actions .btn{width:100%;justify-content:center}
    }
  </style>
  <script src="/js/theme.js"></script>
  <script>(function(){document.documentElement.classList.add('auth-pending');var ru=encodeURIComponent(location.pathname+location.search);fetch('/api/settings',{credentials:'include'}).then(function(r){if(r.status===401){location.href='/login.html?returnUrl='+ru;return;}document.documentElement.classList.remove('auth-pending');}).catch(function(){location.href='/login.html?returnUrl='+ru;});})();</script>
</head>
<body class="app-layout" data-page-title="Медиафайлы">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img class="sidebar-logo" alt="NeoFit">
      <span class="sidebar-brand-name">NeoFit TV</span>
    </div>
    <nav class="sidebar-nav" id="main-nav"></nav>
    <div class="sidebar-footer">
      <div id="theme-toggle-container"></div>
      <button type="button" class="btn btn-secondary btn-block btn-sm" id="sidebarLogoutBtn">Выйти</button>
    </div>
  </aside>
  <main class="main-content">
    <header class="page-header">
      <h1>Медиафайлы</h1>
      <button type="button" class="btn btn-secondary btn-sm" id="mediaBulkToggleBtn" style="display:inline-flex;align-items:center;gap:.35rem;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        Выбрать
      </button>
    </header>
    <div class="media-bulk-bar" id="mediaBulkBar">
      <span class="bulk-count" id="mediaBulkCount">0 выбрано</span>
      <button type="button" class="btn btn-secondary btn-sm" id="mediaBulkCancelBtn">Отмена</button>
      <button type="button" class="btn btn-danger btn-sm" id="mediaBulkDeleteBtn" disabled>Удалить выбранные</button>
    </div>
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept="image/*,video/*" multiple>
      <svg class="uz-icon" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/></svg>
      <p class="uz-title">Перетащите файлы сюда</p>
      <p class="uz-sub">или <span class="uz-link">нажмите для выбора</span></p>
      <p class="uz-hint" id="uploadZoneHint">PNG, JPG, WebP, MP4, MOV — до <span id="uploadZoneLimitLabel">500</span> МБ</p>
    </div>
    <div class="progress-bar-wrap" id="progressBarWrap" style="display: none;">
      <p class="progress-bar-label" id="progressBarLabel"></p>
      <div class="progress-bar" id="progressBar">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
    </div>
    <section class="card media-card-section">
      <div class="card-body">
        <div class="media-toolbar">
          <div class="form-group media-toolbar-search">
            <label for="mediaSearch">Поиск по имени</label>
            <input type="text" id="mediaSearch" class="input" placeholder="Введите часть имени файла…" autocomplete="off">
          </div>
          <div class="form-group media-toolbar-sort">
            <label for="mediaSort">Сортировка</label>
            <select id="mediaSort" class="media-sort-select">
              <option value="date-desc">По дате — сначала новые</option>
              <option value="date-asc">По дате — сначала старые</option>
              <option value="name-asc">По имени — А–Я</option>
              <option value="name-desc">По имени — Я–А</option>
              <option value="size-desc">По размеру — сначала большие</option>
              <option value="size-asc">По размеру — сначала маленькие</option>
            </select>
          </div>
          <div class="form-group media-toolbar-type">
            <label for="mediaTypeFilter">Тип</label>
            <select id="mediaTypeFilter" class="media-type-select">
              <option value="all">Все</option>
              <option value="image">Изображения</option>
              <option value="video">Видео</option>
            </select>
          </div>
          <div class="form-group" style="justify-content:flex-end;align-self:flex-end;">
            <div class="media-view-toggle">
              <button type="button" class="media-view-btn active" id="mediaViewGrid" title="Сетка" aria-label="Вид: сетка">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
              </button>
              <button type="button" class="media-view-btn" id="mediaViewList" title="Список" aria-label="Вид: список">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div id="mediaGrid" class="media-grid"></div>
    <div class="modal-overlay" id="mediaPreviewModal">
      <div class="modal" style="max-width: 90vw;">
        <div class="modal-header">
          <h2 id="mediaPreviewTitle">Просмотр медиа</h2>
          <button type="button" class="close-btn" id="mediaPreviewClose" aria-label="Закрыть">&times;</button>
        </div>
        <div class="modal-body">
          <img id="mediaPreviewImage" alt="" style="max-width:100%;max-height:70vh;display:none;">
          <video id="mediaPreviewVideo" controls playsinline style="width:100%;max-height:70vh;display:none;"></video>
          <div id="mediaPreviewMeta" class="stat-label" style="margin-top:0.75rem;"></div>
        </div>
      </div>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/admin-mobile.js"></script>
  <script src="/js/admin-media.js"></script>
</body>
</html>
