plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.signage.player'
    compileSdk 35
    defaultConfig {
        applicationId "com.signage.player"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // Per-club APKs. Each flavor injects its own app_name (visible in the
    // Android launcher) and DEFAULT_SERVER_URL (used to preselect the right
    // entry in the Spinner on fresh installs).
    //
    // NeoFit keeps the original applicationId so existing installs upgrade
    // seamlessly. Labgym/Soham get suffixed packages — they install as new
    // apps on devices that previously had the single-package build, and the
    // old app must be uninstalled manually after verifying the new one works.
    //
    // Build all three at once: ./gradlew assembleDebug
    // Or one at a time:        ./gradlew assembleNeofitDebug
    flavorDimensions += "brand"
    productFlavors {
        neofit {
            dimension "brand"
            applicationId "com.signage.player"
            resValue "string", "app_name", "NeoFit TV"
            buildConfigField "String", "DEFAULT_SERVER_URL", "\"https://tv.n-fit.ru\""
        }
        labgym {
            dimension "brand"
            applicationId "com.signage.player.labgym"
            resValue "string", "app_name", "Labgym TV"
            buildConfigField "String", "DEFAULT_SERVER_URL", "\"https://tv.labgym.ru\""
        }
        soham {
            dimension "brand"
            applicationId "com.signage.player.soham"
            resValue "string", "app_name", "Soham TV"
            buildConfigField "String", "DEFAULT_SERVER_URL", "\"https://tv.soham-fit.ru\""
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // ExoPlayer (Media3) — native video playback with SurfaceView + SimpleCache
    implementation 'androidx.media3:media3-exoplayer:1.9.2'
    implementation 'androidx.media3:media3-ui:1.9.2'
    implementation 'androidx.media3:media3-datasource:1.9.2'
}
