# Force TLS 1.2 for dependency downloads to avoid "bad_record_mac" / Tag mismatch
# when JDK 21 or a proxy/antivirus corrupts TLS 1.3 GCM traffic.
org.gradle.jvmargs=-Djdk.tls.client.protocols=TLSv1.2 -Dhttps.protocols=TLSv1.2

# Use same for any subprocess
systemProp.https.protocols=TLSv1.2
systemProp.jdk.tls.client.protocols=TLSv1.2

# Slightly longer timeouts for slow or unstable networks
org.gradle.daemon=true
org.gradle.parallel=true

# Project path on dev machine contains Cyrillic ("...ТВ2..."); AGP refuses to
# build by default. The flag is a known workaround — Google's tracker
# (b/95744) acknowledges it. If a flavor build mysteriously fails with
# obscure resource/path errors, move the project to an ASCII-only directory.
android.overridePathCheck=true
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
