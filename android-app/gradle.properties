# Force TLS 1.2 for dependency downloads to avoid "bad_record_mac" / Tag mismatch
# when JDK 21 or a proxy/antivirus corrupts TLS 1.3 GCM traffic.
org.gradle.jvmargs=-Djdk.tls.client.protocols=TLSv1.2 -Dhttps.protocols=TLSv1.2

# Use same for any subprocess
systemProp.https.protocols=TLSv1.2
systemProp.jdk.tls.client.protocols=TLSv1.2

# Slightly longer timeouts for slow or unstable networks
org.gradle.daemon=true
org.gradle.parallel=true

android.useAndroidX=true
android.enableJetifier=true
